<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}InterviewAce{% endblock %}</title>

    <!-- Google Fonts: Montserrat (headings) and DM Sans (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <style>
        /* ===== Global Styles ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fb;
            color: #1e293b;
            line-height: 1.6;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        /* All Headings use Montserrat */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        h1 {
            font-size: 2rem;
            line-height: 1.2;
        }

        h2 {
            font-size: 1.5rem;
            line-height: 1.3;
        }

        h3 {
            font-size: 1.25rem;
            line-height: 1.4;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== Navbar ===== */
        .navbar {
            background-color: #ffffff;
            color: #1e293b;
            padding: 0.85rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
        }

        .navbar-brand {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0f172a;
        }

        .navbar-brand span {
            color: #2563eb;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #64748b;
            font-weight: 500;
            font-size: 0.925rem;
            padding: 0.35rem 0;
            position: relative;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: #0f172a;
        }

        .nav-links a.active {
            color: #2563eb;
            font-weight: 600;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #2563eb;
            border-radius: 1px;
        }

        /* ===== Main Content ===== */
        .container {
            max-width: 1080px;
            margin: 2.75rem auto;
            padding: 0 1.75rem;
        }

        /* ===== Footer ===== */
        footer {
            text-align: center;
            padding: 2.25rem 1rem;
            color: #94a3b8;
            font-size: 0.875rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 5rem;
            background-color: #ffffff;
            font-family: 'DM Sans', sans-serif;
        }

        /* ===== Utility ===== */
        .text-muted {
            color: #64748b;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ================= NAVBAR ================= -->
    <nav class="navbar">
        <a href="{% url 'home' %}" class="navbar-brand">
            LeetCode <span>Explorer</span>
        </a>

        <ul class="nav-links">
            <li>
                <a href="{% url 'problem' %}"
                   class="{% if request.resolver_match.url_name == 'problem' %}active{% endif %}">
                    Leetcode Practice
                </a>
            </li>
            <li>
                <a href="{% url 'runner' %}"
                   class="{% if request.resolver_match.url_name == 'editor' %}active{% endif %}">
                    Code Editor
                </a>
            </li>
        </ul>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>



    {% block extra_js %}{% endblock %}
</body>
</html>
